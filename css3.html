
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* element selector */
        div{
           /* ;background-color:red*/
        }

        /*class Selector*/
        .red{
            background-color: red;
        }
        /* ID selector */
        #green{
            background-color:green;
        }

        /* Child Selector */
        div > p {
            color: blue;
            background-color: yellow;
        }
         /*Universal selector*/
        * {
            margin:0;
            padding: 0;
        }
        /* pseudo Selector */
        a:visited{
            color:palevioletred
        }
        a:hover{
            background-color: yellow;
        }


    </style>
    
</head>
<body>
    <div> class</div>
    <div class="red">
        I am a div
        <p> I am a child  selector div </p>
    </div>

    <div id="green"> I am another div</div>
    <a href="https://www.google.com" > GO to google</ a>  
</body>
</html>
